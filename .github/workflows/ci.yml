name: CI/CD - AIOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. MÉTRICA DE PROYECTO: Eficacia de la Revisión (Análisis Estático)
  analisis-estatico:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Instalar Escáner (Flake8)
      run: pip install flake8
    - name: Buscar Defectos Estáticos y Malas Prácticas
      # Esto detendrá el push si encuentra errores críticos de sintaxis o variables no usadas
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. MÉTRICA DE PROCESO: Eficacia de las Pruebas (Pytest)
  pruebas-automatizadas:
    needs: analisis-estatico # Solo corre las pruebas si el código pasó la revisión estática
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests docker
    - name: Ejecutar Pruebas (Pytest)
      run: python -m pytest test_monitor_ia.py -v