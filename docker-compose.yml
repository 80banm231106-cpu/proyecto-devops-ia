version: '3.8'

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    labels:
      - "monitoreo_ia=activo" 

  db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_base_datos
    labels:
      - "monitoreo_ia=activo"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 3